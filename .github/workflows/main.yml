name: Deploy Next.js Portfolio

# Memicu robot bekerja setiap ada push ke branch 'main'
on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Eksekusi Remote SSH untuk Build & Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # 1. Masuk ke folder proyek Anda
            cd /var/www/portfolio-frontend
            
            # 2. Tarik kode terbaru dari GitHub
            git pull origin main
            
            # 3. Instal dependencies baru (jika ada penambahan package)
            npm install
            
            # 4. Bangun ulang (Build) aplikasi Next.js
            npm run build
            
            # 5. Restart aplikasi di PM2 agar perubahan langsung tayang
            pm2 restart portfolio
